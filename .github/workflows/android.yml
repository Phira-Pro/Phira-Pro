name: Build Android APK

# 可单独手动构建，也可由 Release 工作流调用；日常 push 不触发。
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        description: Commit to build; empty uses the triggering ref
        type: string
        default: ''
    secrets:
      PHIRA_PRO_KEYSTORE_BASE64:
        required: true
      PHIRA_PRO_KEYSTORE_PASSWORD:
        required: true
      PHIRA_PRO_KEY_ALIAS:
        required: true
      PHIRA_PRO_KEY_PASSWORD:
        required: true

jobs:
  apk:
    name: Release APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Verify versions
        run: python scripts/version.py check

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify multi-finger input routing
        run: python scripts/verify_android_multitouch.py

      # runner 预装了 Android SDK / cmdline-tools，这里只用它的 sdkmanager 补齐
      # 需要的 platform / build-tools / NDK，避免依赖第三方 setup action。
      - name: Install Android SDK components
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # rust-toolchain.toml 锁定了 nightly-2026-01-01；cargo-ndk 用默认工具链安装。
      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      # Rust 冷编译很慢，FFmpeg 静态库也要从 GitHub 下载，缓存能省掉大部分时间。
      - name: Cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            prpr-avc/static-lib
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'prpr-avc/ffmpeg-version') }}
          restore-keys: android-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x phira-android/gradlew

      # 签名密钥来自组织级 Secret（PHIRA_PRO_*）。解码到 runner 临时目录（工作区之外，
      # 随 runner 销毁），Gradle 通过环境变量读取，密钥不会落进仓库或构建产物。
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PHIRA_PRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHIRA_PRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHIRA_PRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PHIRA_PRO_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "缺少 Android 签名 Secret；需要配置四项 PHIRA_PRO_* 签名参数"; exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          ls -l "$RUNNER_TEMP/keystore.jks"

      # 一条命令完成：cargo-ndk 编 libphira.so（Gradle 里的 cargoNdkBuild 任务）
      # → 复用仓库 assets → 打包并用 Secret 注入的密钥签名。
      - name: Build release APK
        working-directory: phira-android
        env:
          PHIRA_PRO_KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          PHIRA_PRO_KEYSTORE_PASSWORD: ${{ secrets.PHIRA_PRO_KEYSTORE_PASSWORD }}
          PHIRA_PRO_KEY_ALIAS: ${{ secrets.PHIRA_PRO_KEY_ALIAS }}
          PHIRA_PRO_KEY_PASSWORD: ${{ secrets.PHIRA_PRO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # 确认签名真的生效：若密钥缺失，Gradle 会产出未签名 APK，这一步让它显式失败
      - name: Verify APK signature
        working-directory: phira-android
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Name release APK
        run: |
          set -euo pipefail
          VERSION="$(python scripts/version.py show --field pro_version)"
          mkdir -p dist/android
          cp phira-android/app/build/outputs/apk/release/app-release.apk "dist/android/PhiraPro-v${VERSION}-android-arm64-v8a.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PhiraPro-android-apk
          path: dist/android/*.apk
          if-no-files-found: error
