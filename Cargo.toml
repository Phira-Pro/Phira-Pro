[workspace]
members = [
    "phira",
    "phira-main",
    "prpr",
    "prpr-auto-offset",
    "prpr-avc",
    "prpr-l10n",
    "prpr-pbc",
    "tools/auto-offset-cli",
]
exclude = ["vendor"]
resolver = "2"

[patch.crates-io]
# JNI 的 Android 布尔返回值需要按 unsigned char 读取，防止虚假的
# ExceptionCheck 导致输入框和 HTTPS 验证器在启动时 panic。
# 补丁由独立仓库维护，主仓库不保存外部库源码。
jni = { git = "https://github.com/Phira-Pro/prpr-jni", rev = "2dd17c0e6edee01e6a8214e2dcebe35b9cf42687" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(closed)', 'cfg(flash)'] }

[workspace.package]
# Generated from version.json; update with python scripts/version.py sync.
version = "0.8.2"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
base64 = "0.22.1"
bitflags = "2.11.0"
chrono = "0.4.44"
fluent = "0.17.0"
fluent-syntax = "0.12.0"
futures-util = "0.3.32"
hex = "0.4.3"
http = "1"
image = { version = "0.25.10", default-features = false }
inputbox = "0.1.5"
lru = "0.16.3"
lyon = "1.0.19"

# 默认编译固定 Git commit，避免旧版本因分支更新发生 API/构建兼容性变化。
# macroquad/miniquad 使用配套提交；升级须同时更新 rev 和 Cargo.lock 并检查 Android/桌面编译。
macroquad = { git = "https://github.com/Phira-Pro/prpr-macroquad", rev = "8d617ff60dd0c6c1d237e5c26ecde16e2ed0c72e", default-features = false }
miniquad = { git = "https://github.com/Phira-Pro/prpr-miniquad", rev = "1796f445440edf6b66d4d3a8491f9ac1c53ba52a" }
nalgebra = "0.34.1"

objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-ui-kit = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
once_cell = "1.21.4"
phira = { path = "phira", default-features = false }
pollster = "0.4.0"
prpr = { path = "prpr", default-features = false }
prpr-auto-offset = { path = "prpr-auto-offset" }
prpr-avc = { path = "prpr-avc" }
prpr-l10n = { path = "prpr-l10n" }
rand = "0.8.5"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false }
rfd = "0.17.2"
# 固定已验证的 f64 音频 API，历史版本也不跟随分支漂移。
sasa = { git = "https://github.com/Phira-Pro/sasa", rev = "5049b671cff93be1cf2f7a3f693e7ae1f0c179f7", default-features = false }
serde = "1.0.228"
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
sys-locale = "0.3.2"
tempfile = "3.27.0"
tokio = "1.50.0"
tracing = "0.1.44"
uuid = "1.22.0"
url = "2"
walkdir = "2.5.0"
zip = { version = "8.3.0", default-features = false }

[profile.release]
opt-level = 2
strip = true

[profile.dev.package."*"]
opt-level = 2
