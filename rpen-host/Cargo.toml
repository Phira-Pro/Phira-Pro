[package]
name = "rpen-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
base64 = "0.22"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.3.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { workspace = true }
tao = "=0.37.2"
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }

[build-dependencies]
cc = "1"
